[workspace]
resolver = "2"
members = ["crates/kvcachex", "crates/kvx"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = 1          # symbols for profiling
codegen-units = 1
lto = "thin"
